 if(Lh&&Lq)for(const l of lines)if(l.y>Lh.y+4&&l.y<Lq.y-8)for(const i of l.it){let c=cols[0];for(const k of cols)if(k.x<=i.x+12)c=k;(cell[c.k]=cell[c.k]||[]).push(i)}

 const Ls=Lc||Lr,nx=La||Ls,bottom=Math.max(...its.map(i=>i.y))+8,topOf=L=>L.y-Math.max(L.h,9)*1.35,end=Ls?topOf(Ls):bottom;

 if(!ca){const m=rtx.match(/correct answer is\s+(?:choice\s+)?([^\s.][^\s]*?)\.?(?:\s|$)/i)||rtx.match(/\bChoice\s+([A-D])\s+is\s+(?:the\s+)?correct/i);if(m)ca=m[1]}

 const q={n,id:idm[1],test:g('Test')||(vt.match(/Reading and Writing|Math/)||[''])[0],domain:g('Domain'),skill:g('Skill'),

/* built-in graphing calculator (Desmos cannot be embedded here) */
const GC=['#c74440','#2d70b3','#388c46','#6042a6','#000000','#fa7e19'],VR=/^([a-wz])\s*=\s*(-?\d*\.?\d+)$/i,SB='₀₁₂₃₄₅₆₇₈₉',sb=n=>String(n).replace(/\d/g,d=>SB[d]),gfm=v=>String(+(+v).toPrecision(4));
const newT=()=>({k:'t',d:Array.from({length:6},()=>['',''])});
const G={cx:0,cy:0,s:40,it:[{k:'e',v:''},{k:'e',v:''}],f:[],v:[],p:[]};
function prep(s){return s.replace(/[₀-₉]/g,c=>SB.indexOf(c)).replace(/\u2212/g,'-').replace(/[×·]/g,'*').replace(/π/g,'pi').replace(/([xye])_\{?(\d+)\}?/g,'$1$2').replace(/\blog\(/g,'log10(').replace(/\bln\(/g,'log(')
 .replace(/[A-Za-z]+\d*/g,t=>{if(/^[xye]\d+$/.test(t)||t in math)return t;const m=t.match(/[xy]\d+|[A-Za-z]|\d+/g);return m.length>1?'('+m.join('*')+')':t})}
function gcond(s){const p=s.split(/(<=|>=|<|>|=)/).map(z=>z.trim());if(p.length<3)throw 0;const e=[];for(let i=1;i<p.length;i+=2)e.push(`(${prep(p[i-1])}) ${p[i]==='='?'==':p[i]} (${prep(p[i+1])})`);return math.compile(e.join(' and '))}
function nlfit(rf,np){let p=Array(np).fill(1),lam=.01;const sse=q=>rf(q).reduce((a,r)=>a+r*r,0);let e=sse(p);if(!isFinite(e))throw 0;

  p.forEach((_,k)=>{const h=1e-6*Math.max(1,Math.abs(p[k])),q=[...p];q[k]+=h;rf(q).forEach((v,i)=>J[i][k]=(v-r0[i])/h)});
  const Jt=math.transpose(J),A=math.multiply(Jt,J),g=math.multiply(Jt,r0).map(v=>-v);let ok=false;
  for(let t=0;t<12&&!ok;t++){let d;try{d=math.lusolve(A.map((row,i)=>row.map((v,j)=>i===j?v+lam*(v||1):v)),g).flat()}catch(_){lam*=10;continue}
   const q=p.map((v,k)=>v+d[k]),e2=sse(q);if(isFinite(e2)&&e2<=e){ok=true;const fin=e-e2<=1e-13*(1+e);p=q;e=e2;lam=Math.max(lam/5,1e-9);if(fin)return{p,e}}else lam*=10}
  if(!ok)break}

function gparse(){
 const sc={};G.f=[];G.v=[];G.p=[];let tn=0;
 G.it.forEach(it=>{it.rs='';if(it.k==='e'){it.v=it.v.replace(/≈/g,'~');const m=it.v.trim().match(VR);if(m)sc[m[1]]=+m[2]}else{it.n=++tn;it.P=it.d.map(r=>[parseFloat(r[0]),parseFloat(r[1])]).filter(q=>isFinite(q[0])&&isFinite(q[1]));sc['x'+it.n]=it.P.map(q=>q[0]);sc['y'+it.n]=it.P.map(q=>q[1])}});
 let rn=0;
 G.it.forEach((it,k)=>{if(it.k!=='e'||!it.v.includes('~'))return;const col=GC[k%GC.length];rn++;
  try{const i0=it.v.indexOf('~');let A=it.v.slice(0,i0),B=it.v.slice(i0+1),cd=null;const rm=B.match(/^(.*?)\s*\{([^}]*)\}\s*$/);if(rm){B=rm[1];cd=gcond(rm[2])}
   const tcol=z=>{const m=prep(z.trim()).match(/^y(\d+)$/);return m&&G.it.find(t=>t.k==='t'&&t.n===+m[1])};
   const syms=ns=>{const nm=new Set();ns.forEach(n0=>n0.traverse((n,path,par)=>{if(n.isSymbolNode&&!(par&&par.isFunctionNode&&path==='fn'))nm.add(n.name)}));return[...nm]};
   const toL=v=>{if(v&&v.toArray)v=v.toArray();return(Array.isArray(v)?v.flat(9):[v]).map(Number)};
   const T=tcol(A)||tcol(B),M=tcol(A)?B:A;let ps,rf,pv,r2=null;
   if(T){const xn='x'+T.n,node=math.parse(prep(tcol(A)?B:A)),c=node.compile();ps=syms([node]).filter(z=>z!==xn&&z!=='x'&&!(z in sc)&&!(z in math)&&!/^[xy]\d+$/.test(z));
    let P=T.P;if(cd)P=P.filter(([x,y])=>cd.evaluate({...sc,x,[xn]:x,['y'+T.n]:y}));if(P.length<Math.max(2,ps.length))throw'n';
    const fy=(q,x)=>{const s2={...sc,x,[xn]:x};ps.forEach((z,i)=>s2[z]=q[i]);const v=c.evaluate(s2);return typeof v==='number'?v:NaN};
    rf=q=>P.map(([x,y])=>y-fy(q,x));pv=ps.length?nlfit(rf,ps.length).p:[];ps.forEach((z,i)=>sc[z]=pv[i]);
    const my=P.reduce((a,q)=>a+q[1],0)/P.length,sst=P.reduce((a,q)=>a+(q[1]-my)**2,0),sse=rf(pv).reduce((a,v)=>a+v*v,0);r2=sst?1-sse/sst:1;
    const s3={...sc};G.f.push({ev:x=>{s3.x=x;s3[xn]=x;const v=c.evaluate(s3);return typeof v==='number'?v:NaN},col})}
   else{const nA=math.parse(prep(A)),nB=math.parse(prep(B)),cA=nA.compile(),cB=nB.compile();ps=syms([nA,nB]).filter(z=>!(z in sc)&&!(z in math));
    rf=q=>{const s2={...sc};ps.forEach((z,i)=>s2[z]=q[i]);const a=toL(cA.evaluate(s2)),b=toL(cB.evaluate(s2));return Array.from({length:Math.max(a.length,b.length)},(_,i)=>a[a.length>1?i:0]-b[b.length>1?i:0])};
    pv=ps.length?nlfit(rf,ps.length).p:[];ps.forEach((z,i)=>sc[z]=pv[i])}
   const res=rf(pv);if(!res.length||res.some(v=>!isFinite(v)))throw 0;sc['e'+rn]=res;
   const dn=z=>esc(z.replace(/([A-Za-z])(\d+)$/,(_,a,d)=>a+sb(d)));
   it.rs=(ps.length?'<span class="lb">REGRESSION PARAMETERS</span>'+ps.map((z,i)=>`${dn(z)} = ${gfm(pv[i])}`).join(',  '):'')+'<span class="lb">STATISTICS</span>RMSE = '+gfm(Math.sqrt(res.reduce((a,v)=>a+v*v,0)/res.length))+(r2!=null?'   r² = '+gfm(r2):'')+`<span class="lb">RESIDUALS</span>e${sb(rn)} = [${res.slice(0,8).map(gfm).join(', ')}${res.length>8?', …':''}]`}
  catch(e){it.rs=e==='n'?'Need more data points':'Can’t fit that'}});
 G.it.forEach((it,k)=>{if(it.k!=='e'||it.v.includes('~'))return;const col=GC[k%GC.length],t=it.v.trim();if(!t||VR.test(t))return;
  try{let s0=t,cd=null;const rm=s0.match(/^(.*?)\s*\{([^}]*)\}\s*$/);if(rm){s0=rm[1];cd=gcond(rm[2])}
   s0=s0.replace(/^(y|f\(x\))\s*=\s*/i,'');const xm=s0.match(/^x\s*=\s*(.+)$/);
   if(xm){G.v.push({x:math.evaluate(prep(xm[1]),sc),col});return}
   const node=math.parse(prep(s0)),c=node.compile();
   if(node.filter(z=>z.isSymbolNode&&z.name==='x').length)G.f.push({ev:x=>{sc.x=x;return cd&&!cd.evaluate(sc)?NaN:c.evaluate(sc)},col});
   else{const v=c.evaluate(sc);it.rs='= '+(typeof v==='number'?+v.toPrecision(10):math.format(v,{precision:8}))}}catch(e){it.rs='?'}});
 G.it.forEach((it,k)=>{if(it.k==='t')it.P.forEach(q=>G.p.push({x:q[0],y:q[1],col:GC[k%GC.length]}))});
 G.it.forEach((it,k)=>{const e=document.querySelector(`#ex [data-i="${k}"] .rs`);if(e)e.innerHTML=it.rs||''})}
function grender(){
 let tn=0;$('#ex').innerHTML=G.it.map((it,k)=>{if(it.k==='t')it.n=++tn;const c=GC[k%GC.length],nm=`<b class="nm" style="background:${c}">${k+1}</b>`,x='<button class="s" data-g="del" title="Delete">✕</button>';
  if(it.k==='e'){const vm=it.v.trim().match(VR);return `<div class="er" data-i="${k}">${nm}<input data-f="v" value="${esc(it.v)}" placeholder="${k?'':'y = 2x + 1'}" autocomplete="off" spellcheck="false">${x}${vm?`<input type="range" data-sl data-n="${vm[1]}" min="-10" max="10" step=".1" value="${vm[2]}">`:''}<span class="rs"></span></div>`}
  return `<div class="er tb" data-i="${k}">${nm} <b>Table</b> ${x}<table class="tt"><tr><th>x${sb(it.n)}</th><th>y${sb(it.n)}</th></tr>${it.d.map((r,j)=>`<tr><td><input data-r="${j}" data-c="0" value="${esc(r[0])}"></td><td><input data-r="${j}" data-c="1" value="${esc(r[1])}"></td></tr>`).join('')}</table><select data-f="addreg"><option value="">Add regression…</option><option value="linear">Linear</option><option value="quadratic">Quadratic</option><option value="cubic">Cubic</option><option value="exponential">Exponential</option><option value="power">Power</option><option value="log">Logarithmic</option></select><div class="m sm">Adds a fitted row below. You can also type your own, like <b>y${sb(it.n)} ~ m x${sb(it.n)} + b</b></div><span class="rs"></span></div>`}).join('')
  +'<div class="er"><button class="s" data-g="ae">+ Expression</button><button class="s" data-g="at">+ Table</button></div><div class="m sm">Type an expression in x, x = 3, or a = 2 (adds a slider). Tables plot points; fit them with y₁ ~ m x₁ + b (add {x₁>5} to limit which points). Lists work too: <b>[3, x₁] ~ [3, 9]</b> solves x₁ = 9. Drag to pan, scroll to zoom.</div>';

function gopen(){const ex=$('#ex');if(!ex.dataset.on){ex.dataset.on=1;
 ex.oninput=e=>{const t=e.target,row=t.closest('[data-i]');if(!row)return;const it=G.it[+row.dataset.i];
  if(t.dataset.sl!==undefined){it.v=t.dataset.n+' = '+t.value;row.querySelector('[data-f=v]').value=it.v}
  else if(t.dataset.f==='v')it.v=t.value;
  else if(t.dataset.c!==undefined){it.d[+t.dataset.r][+t.dataset.c]=t.value;const L=it.d[it.d.length-1];if(L[0]!==''||L[1]!==''){const n=it.d.push(['',''])-1;row.querySelector('table').insertAdjacentHTML('beforeend',`<tr><td><input data-r="${n}" data-c="0"></td><td><input data-r="${n}" data-c="1"></td></tr>`)}}
  gparse();gdraw()};
 ex.onchange=e=>{const t=e.target,row=t.closest('[data-i]');if(!row)return;const it=G.it[+row.dataset.i];
  if(t.dataset.f==='addreg'){if(!t.value)return;const X='x'+sb(it.n),Y='y'+sb(it.n),T={linear:`${Y} ~ m ${X} + b`,quadratic:`${Y} ~ a ${X}^2 + b ${X} + c`,cubic:`${Y} ~ a ${X}^3 + b ${X}^2 + c ${X} + d`,exponential:`${Y} ~ a b^${X}`,power:`${Y} ~ a ${X}^b`,log:`${Y} ~ a + b ln(${X})`}[t.value];G.it.splice(+row.dataset.i+1,0,{k:'e',v:T});grender();return}
  if(t.dataset.f==='v'&&!!VR.test(it.v.trim())!==!!row.querySelector('[data-sl]'))grender()};
 ex.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;
  if(g==='ae')G.it.push({k:'e',v:''});else if(g==='at')G.it.push(newT());else if(g==='del'){G.it.splice(+b.closest('[data-i]').dataset.i,1);if(!G.it.length)G.it.push({k:'e',v:''})}grender()};
 ex.onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.f==='v'&&+e.target.closest('[data-i]').dataset.i===G.it.length-1){G.it.push({k:'e',v:''});grender();const a=ex.querySelectorAll('[data-f=v]');a[a.length-1].focus()}};
 const c=$('#gc');let dr=null;

function gdraw(){const c=$('#gc');if(!c||!c.clientWidth)return;const w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
