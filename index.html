        // 2. Disable Common Inspect Shortcuts
        document.addEventListener('keydown', (e) => {
            // Disable F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I, J, and C
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();

<style>
:root{--bg:#fff;--card:#fff;--tx:#1b1b1b;--mut:#5f6368;--bd:#cfd3dc;--ac:#324fbe;--ok:#1b7f3b;--bad:#c0392b;--okb:#e3f3e8;--badb:#fbe7e4;--hd:#e9edf8;--ban:#1d2a6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1d22;--tx:#e8e8ea;--mut:#9ba0aa;--bd:#3a3e48;--ac:#8ea3ff;--ok:#56c884;--bad:#ff8173;--okb:#14291c;--badb:#33191a;--hd:#1c2030;--ban:#0f1740;color-scheme:dark}
:root:not([data-theme="light"]) canvas.q{filter:invert(1) hue-rotate(180deg)}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1d22;--tx:#e8e8ea;--mut:#9ba0aa;--bd:#3a3e48;--ac:#8ea3ff;--ok:#56c884;--bad:#ff8173;--okb:#14291c;--badb:#33191a;--hd:#1c2030;--ban:#0f1740;color-scheme:dark}
:root[data-theme="dark"] canvas.q{filter:invert(1) hue-rotate(180deg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:12px 16px 0}
h1{font-size:1.5rem;margin:.2em 0}h3{margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.c{max-width:640px;margin:5vh auto}.m{color:var(--mut)}
button,select,input[type=number],#sp{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
button.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
button.s,label.s{padding:5px 10px;font-size:.82rem;border-radius:8px;display:inline-flex;gap:5px;align-items:center;border:1px solid var(--bd);cursor:pointer}
.pill{border-radius:99px;padding:8px 24px}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:34px 12px;text-align:center;cursor:pointer;margin:14px 0}.drop.hv{border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.g label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mut)}.g select,.g input{width:100%}
.top{position:sticky;top:0;z-index:30}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hd);padding:8px max(16px,calc((100vw - 1100px)/2));flex-wrap:wrap}
.hc{display:flex;align-items:center;gap:10px}.hr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tmr{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:center}
.ban{background:var(--ban);color:#fff;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:3px}
.nav{position:relative;display:flex;gap:5px;overflow-x:auto;padding:10px 0 6px}
.nv{flex:none;width:34px;padding:3px 0;font-size:.8rem;border-radius:8px}
.nv.an{background:var(--bd)}.nv.fl{outline:2px solid #e0a100}.nv.cur{border:2px solid var(--ac)}
.nv.ok{background:var(--okb);border-color:var(--ok)}.nv.bad{background:var(--badb);border-color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tag{font-size:.76rem;padding:1px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.tag.Easy{color:var(--ok)}.tag.Medium{color:#b07d00}.tag.Hard{color:var(--bad)}
.split{display:grid;margin-top:10px}.split.two{grid-template-columns:minmax(0,min(70%,calc(var(--z)*30%))) minmax(0,1fr)}
.split.two .lp{padding:8px 26px 8px 4px;border-right:2px solid var(--bd)}.split.two .rp{padding-left:26px}
.split:not(.two) .lp{display:none}.split:not(.two){max-width:calc(760px*var(--z)/1.7);margin-inline:auto;width:100%}
@media(max-width:760px){.split.two{grid-template-columns:1fr}.split.two .lp{border:0;padding:0 0 14px}.split.two .rp{padding:0}}
.qh{display:flex;align-items:center;gap:8px;background:var(--hd);border-bottom:2px dashed var(--tx);margin-bottom:14px}
.qn{background:var(--tx);color:var(--bg);font-weight:700;padding:4px 14px;align-self:stretch;display:grid;place-items:center}
button.mk{border:0;background:none}button.mk.on{color:var(--ac);font-weight:700}
.qtx,.tx{font-family:"Noto Serif",Georgia,serif;font-size:1.05rem;line-height:1.7}.tx p{margin:0 0 .9em}.tx p:last-child{margin:0}
canvas.q{display:block;height:auto}
.ch{display:flex;align-items:center;gap:14px;border:1.5px solid var(--tx);border-radius:10px;padding:10px 14px;margin:10px 0;cursor:pointer;background:var(--card)}
.ch .cv{flex:1;min-width:0}
.ch .lt{flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--tx);display:grid;place-items:center;font-weight:700;font-family:system-ui,sans-serif}
.xb{flex:none;width:22px;height:22px;border:1.3px solid var(--mut);border-radius:50%;font-size:.68rem;display:grid;place-items:center;text-decoration:line-through;color:var(--mut)}
.ch.sel{border-color:var(--ac);box-shadow:0 0 0 1.5px var(--ac)}.ch.sel .lt{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.ch.ok{border-color:var(--ok);background:var(--okb)}.ch.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.bad{border-color:var(--bad);background:var(--badb)}.ch.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.xo .cv{opacity:.3;text-decoration:line-through}
#sp{width:100%;max-width:300px;font-size:1.2rem;margin-top:6px}
.bn{border-radius:10px;color:#fff;padding:14px 18px;font-size:1.05rem;margin:16px 0 0}.bn.ok{background:#1b7f3b}.bn.bad{background:#b83a2a}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-top:2px dashed var(--bd);padding:10px max(16px,calc((100vw - 1100px)/2)) calc(10px + env(safe-area-inset-bottom,0px))}
.qc{background:var(--tx);color:var(--bg);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}

.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:700}
.lg{display:flex;justify-content:center;gap:16px;font-size:.85rem;margin:10px 0;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.mg{display:flex;flex-wrap:wrap;gap:12px 10px;padding-top:6px}
.nb{position:relative;width:42px;height:34px;padding:0;border:1.5px dashed var(--tx);border-radius:4px;background:none;color:var(--ac);font-weight:700}
.nb.an{background:var(--ac);border:1.5px solid var(--ac);color:var(--bg)}

button.hintb:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}

/* Android/tight-screen polish: keep all animations while preventing narrow-screen overflow. */
@media(max-width:520px){
 .socialstats{grid-template-columns:minmax(0,1fr);gap:7px}

 .podium-card,.podium-card.first{padding:9px 3px 8px;transform:none;min-width:0}
 .podium-card.first .podium-avatar,.podium-avatar{width:32px;height:32px}
 .podium-name{font-size:clamp(.62rem,2.8vw,.76rem);overflow-wrap:anywhere}

}

.qnote-launch{position:fixed;left:0;top:48%;z-index:9990;border:1px solid var(--line,#777);border-left:0;border-radius:0 12px 12px 0;padding:11px 9px;background:var(--card,#222);color:var(--tx,inherit);box-shadow:0 4px 18px #0003;font-size:1.05rem;cursor:pointer}
.qnote-drawer{position:fixed;left:0;top:50%;transform:translate(-105%,-50%);width:min(310px,84vw);max-height:72vh;overflow:auto;z-index:9991;padding:13px;border:1px solid var(--line,#777);border-left:0;border-radius:0 14px 14px 0;background:var(--card,#222);color:var(--tx,inherit);box-shadow:0 8px 30px #0005;transition:transform .22s ease;box-sizing:border-box}
.qnote-drawer.open{transform:translate(0,-50%)}
.qnote-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-weight:700}

/* ===== profile card v2 (taller banner, no ring, status bubble) + community ===== */
.pbn{height:auto;aspect-ratio:9/4;background-repeat:no-repeat;background-size:cover;background-position:center}
.phead{display:flex;align-items:flex-end;gap:14px;margin-top:-46px;margin-bottom:8px}
.pavw{margin:0;flex:none}
.pavx{box-shadow:none;background-repeat:no-repeat;background-size:cover;background-position:center;flex:none;display:grid;place-items:center}
.pstb{position:relative;min-width:0;max-width:100%;margin-bottom:10px;padding:9px 14px;border-radius:14px;font-size:.93rem;line-height:1.35;overflow-wrap:anywhere;background:color-mix(in srgb,var(--sb,var(--ac)) 14%,var(--card));border:1px solid color-mix(in srgb,var(--sb,var(--ac)) 45%,transparent)}
.pstb::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;box-sizing:border-box;background:inherit;border-left:1px solid color-mix(in srgb,var(--sb,var(--ac)) 45%,transparent);border-bottom:1px solid color-mix(in srgb,var(--sb,var(--ac)) 45%,transparent);transform:rotate(45deg);border-radius:0 0 0 3px}

#pfp{position:relative;overflow:hidden}
.cmtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmh2{font-size:1rem;margin:18px 0 0}

// Android WebView notification bridge. WebToApp builds differ, so support common bridge names.
function satNativeNotificationAvailable(){
 return !!((window.Android && (typeof window.Android.notification==='function'||typeof window.Android.showNotification==='function'||typeof window.Android.notify==='function')) || typeof window.notification==='function' || (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications));
}
async function satAskNotificationPermission(){
 try{
  if(window.Android&&typeof window.Android.requestNotificationPermission==='function')return await window.Android.requestNotificationPermission();
  if(window.Android&&typeof window.Android.requestNotificationsPermission==='function')return await window.Android.requestNotificationsPermission();
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(cap&&typeof cap.requestPermissions==='function')return await cap.requestPermissions();
  if('Notification' in window){if(Notification.permission==='default')return await Notification.requestPermission();return Notification.permission;}
  return satNativeNotificationAvailable()?'granted':'unsupported';
 }catch(_){return 'error'}
}
async function satSendNotification(title,body){
 try{
  if(window.Android&&typeof window.Android.notification==='function'){window.Android.notification(title,body);return true;}
  if(window.Android&&typeof window.Android.showNotification==='function'){window.Android.showNotification(title,body);return true;}
  if(window.Android&&typeof window.Android.notify==='function'){window.Android.notify(title,body);return true;}
  if(typeof window.notification==='function'){window.notification(title,body);return true;}
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(cap&&typeof cap.schedule==='function'){await cap.schedule({notifications:[{id:Math.floor(Date.now()%2147483000),title,body}]});return true;}
  if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body,tag:'satqbplus-daily-practice',renotify:false});n.onclick=()=>{try{window.focus()}catch(_){}n.close()};return true;}
 }catch(_){}
 return false;
}

function satNotificationPermissionState(){
 try{
  if(window.FlutterFcm&&window.FlutterFcm.permission){const p=String(window.FlutterFcm.permission).toLowerCase();if(p==='authorized'||p==='provisional'||p==='granted')return 'granted';if(p==='denied')return 'denied';}
  if(window.Android&&typeof window.Android.hasNotificationPermission==='function')return window.Android.hasNotificationPermission()?'granted':'denied';
  if(window.Android&&typeof window.Android.getNotificationPermissionState==='function')return String(window.Android.getNotificationPermissionState()).toLowerCase();
  if('Notification' in window)return Notification.permission;
  return satNativeNotificationAvailable()?'granted':'unsupported';
 }catch(_){return 'unknown'}
}
function satUpdateNotificationStatus(message){
 const status=document.getElementById('stremstatus');if(!status)return;
 if(message){status.textContent=message;return;}
 const p=satNotificationPermissionState();
 status.textContent=p==='granted'?'Notifications are enabled. SAT QB+ will check for reminders while it is open.':p==='denied'?'Notifications are blocked by device/app settings. Allow them in Android Settings to receive reminders.':p==='default'?'Notification permission has not been granted yet. SAT QB+ will request it automatically when supported.':'Notification status could not be confirmed in this WebView. Check WebToApp notification integration.';
}
async function satAutoRequestNotificationPermission(){
 try{
  if(ls('satreminders')==='0')return;
  const state=satNotificationPermissionState();
  if(state==='granted'){ls('satreminders','1');satUpdateNotificationStatus();if(window.SATQBCheckReminder)window.SATQBCheckReminder();return;}
  if(state==='denied'||state==='unsupported') {satUpdateNotificationStatus();return;}
  // Avoid repeatedly triggering permission prompts. Browser engines may require a user gesture;
  // WebToApp/native wrappers can handle this request if they expose a permission bridge.
  if(ls('satrempermissionasked')==='1'){satUpdateNotificationStatus();return;}
  ls('satrempermissionasked','1');
  const perm=await satAskNotificationPermission();
  const granted=perm==='granted'||perm==='authorized'||perm==='provisional'||!!(perm&&perm.display==='granted')||!!(perm&&perm.receive==='granted');
  if(granted){ls('satreminders','1');if(window.SATQBCheckReminder)window.SATQBCheckReminder();satUpdateNotificationStatus('Notifications are enabled. SAT QB+ will check for reminders while it is open.');}
  else satUpdateNotificationStatus(perm==='denied'?'Notifications are blocked by device/app settings. Allow them in Android Settings.':'Permission prompt was not available automatically in this WebView.');
 }catch(_){satUpdateNotificationStatus()}
}

const GC=['#c74440','#2d70b3','#388c46','#6042a6','#000000','#fa7e19'],VR=/^([a-wz])\s*=\s*(-?\d*\.?\d+)$/i,SB='₀₁₂₃₄₅₆₇₈₉',sb=n=>String(n).replace(/\d/g,d=>SB[d]),gfm=v=>String(+(+v).toPrecision(4));

function gcond(s){const p=s.split(/(<=|>=|<|>|=)/).map(z=>z.trim());if(p.length<3)throw 0;const e=[];for(let i=1;i<p.length;i+=2)e.push(`(${prep(p[i-1])}) ${p[i]==='='?'==':p[i]} (${prep(p[i+1])})`);return math.compile(e.join(' and '))}
function nlfit(rf,np){let p=Array(np).fill(1),lam=.01;const sse=q=>rf(q).reduce((a,r)=>a+r*r,0);let e=sse(p);if(!isFinite(e))throw 0;
 for(let it=0;it<400;it++){const r0=rf(p),J=r0.map(()=>p.map(()=>0));
  p.forEach((_,k)=>{const h=1e-6*Math.max(1,Math.abs(p[k])),q=[...p];q[k]+=h;rf(q).forEach((v,i)=>J[i][k]=(v-r0[i])/h)});
  const Jt=math.transpose(J),A=math.multiply(Jt,J),g=math.multiply(Jt,r0).map(v=>-v);let ok=false;
  for(let t=0;t<12&&!ok;t++){let d;try{d=math.lusolve(A.map((row,i)=>row.map((v,j)=>i===j?v+lam*(v||1):v)),g).flat()}catch(_){lam*=10;continue}
   const q=p.map((v,k)=>v+d[k]),e2=sse(q);if(isFinite(e2)&&e2<=e){ok=true;const fin=e-e2<=1e-13*(1+e);p=q;e=e2;lam=Math.max(lam/5,1e-9);if(fin)return{p,e}}else lam*=10}
  if(!ok)break}
 return{p,e}}
function gparse(){

 let rn=0;
 G.it.forEach((it,k)=>{if(it.k!=='e'||!it.v.includes('~'))return;const col=GC[k%GC.length];rn++;
  try{const i0=it.v.indexOf('~');let A=it.v.slice(0,i0),B=it.v.slice(i0+1),cd=null;const rm=B.match(/^(.*?)\s*\{([^}]*)\}\s*$/);if(rm){B=rm[1];cd=gcond(rm[2])}
   const tcol=z=>{const m=prep(z.trim()).match(/^y(\d+)$/);return m&&G.it.find(t=>t.k==='t'&&t.n===+m[1])};
   const syms=ns=>{const nm=new Set();ns.forEach(n0=>n0.traverse((n,path,par)=>{if(n.isSymbolNode&&!(par&&par.isFunctionNode&&path==='fn'))nm.add(n.name)}));return[...nm]};
   const toL=v=>{if(v&&v.toArray)v=v.toArray();return(Array.isArray(v)?v.flat(9):[v]).map(Number)};
   const T=tcol(A)||tcol(B),M=tcol(A)?B:A;let ps,rf,pv,r2=null;

    let P=T.P;if(cd)P=P.filter(([x,y])=>cd.evaluate({...sc,x,[xn]:x,['y'+T.n]:y}));if(P.length<Math.max(2,ps.length))throw'n';

    rf=q=>P.map(([x,y])=>y-fy(q,x));pv=ps.length?nlfit(rf,ps.length).p:[];ps.forEach((z,i)=>sc[z]=pv[i]);
    const my=P.reduce((a,q)=>a+q[1],0)/P.length,sst=P.reduce((a,q)=>a+(q[1]-my)**2,0),sse=rf(pv).reduce((a,v)=>a+v*v,0);r2=sst?1-sse/sst:1;

   else{const nA=math.parse(prep(A)),nB=math.parse(prep(B)),cA=nA.compile(),cB=nB.compile();ps=syms([nA,nB]).filter(z=>!(z in sc)&&!(z in math));

  catch(e){it.rs=e==='n'?'Need more data points':'Can’t fit that'}});

   if(mode!=='friends'&&x.audience==='friends')return;
   if(x.username&&x.share&&Object.values(x.share).some(Boolean)){
    // Only use values whose corresponding sharing toggle is on.
    const clean={id:ch.key,username:x.username,avatar:v.avatar||x.avatar||'',share:x.share||{}};
    ['score','streak','answered','accuracy','days'].forEach(k=>{clean[k]=x.share[k]&&x[k]!=null&&Number.isFinite(Number(x[k]))?Number(x[k]):null});
    rows.push(clean);
   }
  });
  /* people who accepted my stats request show up here with their full stats, only for me */
  if(grants.size){const byId=new Map(rows.map(r=>[r.id,r]));
   await Promise.all([...grants].map(async id=>{try{const ps=await FB.m.Db.get(dbr('privateStats/'+id));if(!ps.exists())return;
    const v=snap.child(id).val()||{},x=v.publicStats||{},pv=ps.val()||{},un=v.username||x.username;if(!un)return;
    let row=byId.get(id);if(!row){row={id,username:un,avatar:v.avatar||x.avatar||'',share:{}};rows.push(row);byId.set(id,row)}
    row.sharedWithMe=true;
    ['score','streak','answered','accuracy','days'].forEach(k=>{row[k]=pv[k]!=null&&Number.isFinite(Number(pv[k]))?Number(pv[k]):null})}catch(e){}}))}
  // Resolve each displayed name from the canonical profile username, not only
  // the older publicStats snapshot. This keeps both global and friends rankings
  // current even if the snapshot's username failed to refresh during a rename.
  await Promise.all(rows.map(async row=>{
   try{
    const current=await FB.m.Db.get(dbr('profiles/'+row.id+'/username'));
    if(current.exists()&&String(current.val()).trim())row.username=String(current.val()).trim();
   }catch(nameErr){console.warn('Could not refresh ranking username for '+row.id,nameErr)}
  }));
  // Stable ranking on every device: visible SAT score, then visible answered
  // count, then visible accuracy, then username and UID as deterministic tie-breakers.
  rows.sort((a,b)=>
   (Number(b.score??-1)-Number(a.score??-1)) ||
   (Number(b.answered??-1)-Number(a.answered??-1)) ||
   (Number(b.accuracy??-1)-Number(a.accuracy??-1)) ||
   String(a.username).toLowerCase().localeCompare(String(b.username).toLowerCase()) ||
   String(a.id).localeCompare(String(b.id))
  );
  if(!rows.length){msg.textContent=mode==='friends'?'No published stats from your friends yet. Make sure your friends have saved their sharing settings.':(FB.socialErr?'No published stats found. Your stats could not be published: '+socialErrorText(FB.socialErr):'No public stats yet. Be the first to share yours!');return}
  msg.textContent=mode==='friends'?`${rows.length} friend${rows.length===1?'':'s'} (including you) sharing stats`:`${rows.length} account${rows.length===1?'':'s'} sharing stats`;
  const medal=['🥇','🥈','🥉'],place=['first','second','third'];
  const statItems=x=>[
   x.score!=null?`${esc(x.score)} SAT score`:null,
   x.answered!=null?`${esc(x.answered)} answered`:null,
   x.accuracy!=null?`${esc(x.accuracy)}% accuracy`:null,
   x.streak!=null?`${esc(x.streak)}d streak`:null,
   x.days!=null?`${esc(x.days)} days practiced`:null
  ].filter(Boolean);
  const statLine=x=>statItems(x).join(' · ');
  const statMarkup=x=>{const items=statItems(x),tag=x.sharedWithMe?'<span class="m sm" style="display:block">📊 Shared with you</span>':'';return (items.length?`<div class="rank-stats">${items.map(t=>`<span class="rank-stat">${t}</span>`).join('')}</div>`:'<span class="m sm">Sharing enabled</span>')+tag};
  const avatar=x=>x.avatar?`<span class="podium-avatar" style="${bgStyle(x.avatar,1)}"></span>`:`<span class="podium-avatar">${esc((x.username||'?')[0].toUpperCase())}</span>`;
  const top=rows.slice(0,3);let html='';
  if(top.length){const order=top.length>=3?[top[1],top[0],top[2]]:top.slice();html+=`<div class="podium">${order.map(x=>{const i=rows.indexOf(x);return `<div class="podium-card ${place[i]||''}" data-a="viewp" data-id="${esc(x.id)}" data-n="${esc(x.username)}"><div class="podium-place">${medal[i]||'🏅'}</div>${avatar(x)}<div class="podium-name"><span class="${String(x.username).toLowerCase()==='a'?'dev-username':''}">@${esc(x.username)}</span>${devFlair(x.username,x.id)}</div>${statMarkup(x)}</div>`}).join('')}</div>`}
  html+=rows.slice(3,100).map((x,j)=>{const i=j+3;return `<div class="rankrow" data-a="viewp" data-id="${esc(x.id)}" data-n="${esc(x.username)}"><span class="ranknum">#${i+1}</span><div class="frw rank-user">${x.avatar?`<span class="fav" style="${bgStyle(x.avatar,1)}"></span>`:frAv(x.username)}<div class="rank-user-text"><b class="${String(x.username).toLowerCase()==='a'?'dev-username':''}">@${esc(x.username)}</b>${devFlair(x.username,x.id)}${statMarkup(x)}</div></div></div>`}).join('');
  out.innerHTML=html;
 }catch(e){msg.textContent='Could not load rankings: '+socialErrorText(e)+'. Check that signed-in users can read profiles and your friends list.'}
}

/* ---- image crop tool (banner = wide, picture = square) ---- */
function readSrc(file){return new Promise((res,rej)=>{
 if(/gif$/i.test(file.type)){const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=()=>rej(new Error('bad image'));fr.readAsDataURL(file);return}
 const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const r=Math.min(1,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.95))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};im.src=u})}
/* Animated GIFs can't be cropped by redrawing them (that would freeze them), so the crop is saved
   next to the GIF as  #c=centerX,centerY,zoom,width,height  and applied with CSS wherever it is shown. */
function isGif(s){return /^data:image\/gif/i.test(String(s||''))}
function gifParts(s){s=String(s||'');const i=s.indexOf('#c=');if(i<0||!isGif(s))return null;const p=s.slice(i+3).split(',').map(Number);if(p.length<5||p.some(n=>!isFinite(n))||p[3]<1||p[4]<1)return null;return{src:s.slice(0,i),cx:p[0],cy:p[1],z:Math.max(1,p[2]),iw:p[3],ih:p[4]}}
function bgParts(s,A){const g=gifParts(s);if(!g)return{url:String(s||''),size:'cover',pos:'center'};
 const ar=g.iw/g.ih;let w=ar>=A?ar/A:1,h=ar>=A?1:A/ar;w*=g.z;h*=g.z;
 const px=w-1<1e-6?50:(.5-g.cx*w)/(1-w)*100,py=h-1<1e-6?50:(.5-g.cy*h)/(1-h)*100;
 return{url:g.src,size:(w*100)+'% '+(h*100)+'%',pos:px+'% '+py+'%'}}
function bgStyle(s,A){const b=bgParts(s,A);return`background-image:url('${esc(b.url)}');background-repeat:no-repeat;background-size:${b.size};background-position:${b.pos}`}
function cropOpen(src,o){return new Promise(res=>{const old=document.getElementById('crp');if(old)old.remove();
 const g0=gifParts(src),gif=isGif(src),bsrc=g0?g0.src:src,im=new Image();im.onerror=()=>res(null);
 im.onload=()=>{const W=Math.max(180,Math.min(o.round?320:560,window.innerWidth-80)),H=Math.round(W/o.aspect),iw=im.width,ih=im.height,bs=Math.max(W/iw,H/ih);
  let z=g0?g0.z:1,cx=g0?g0.cx*iw:iw/2,cy=g0?g0.cy*ih:ih/2;const sc=()=>bs*z;
  const d=document.createElement('div');d.id='crp';d.className='unm';d.style.zIndex=80;
  d.innerHTML=`<div class="card" style="width:min(${W+44}px,100%);align-items:center"><h2 style="align-self:flex-start">${esc(o.title)}</h2><canvas id="crpc" width="${W}" height="${H}" style="width:${W}px;height:${H}px;max-width:100%;touch-action:none;cursor:grab;border-radius:${o.round?'12px':'0'};background:#000"></canvas><label class="m sm" style="display:flex;gap:10px;align-items:center;width:100%">Zoom<input type="range" id="crpz" min="100" max="400" value="${Math.round(z*100)}" style="flex:1"></label><p class="m sm" style="margin:0;align-self:flex-start">Drag to move. Use the slider, scroll or pinch to zoom. ${o.round?'The circle is what people will see.':'This whole frame is exactly what shows on your profile.'}${gif?' Your GIF keeps animating after you save; this preview shows a still frame.':''}</p><div class="btns" style="align-self:stretch"><button class="p pill" id="crpok">Apply</button><button class="pill" id="crpno">Cancel</button></div></div>`;
  document.body.appendChild(d);
  const cv=d.querySelector('#crpc'),ctx=cv.getContext('2d'),zs=d.querySelector('#crpz');ctx.imageSmoothingQuality='high';
  const clamp=()=>{const hw=W/(2*sc()),hh=H/(2*sc());cx=Math.min(Math.max(cx,hw),iw-hw);cy=Math.min(Math.max(cy,hh),ih-hh)};
  const draw=()=>{clamp();const hw=W/(2*sc()),hh=H/(2*sc());ctx.clearRect(0,0,W,H);ctx.drawImage(im,cx-hw,cy-hh,2*hw,2*hh,0,0,W,H);
   if(o.round){ctx.save();ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,W/2-2,0,Math.PI*2,true);ctx.fill('evenodd');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,W/2-2,0,Math.PI*2);ctx.stroke();ctx.restore()}};
  const setZ=v=>{z=Math.min(4,Math.max(1,v));zs.value=Math.round(z*100);draw()};
  const pts=new Map();let last=0;
  cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,[e.clientX,e.clientY]);last=0;cv.style.cursor='grabbing'};
  cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);if(pts.size===1){cx-=(e.clientX-p[0])/sc();cy-=(e.clientY-p[1])/sc()}pts.set(e.pointerId,[e.clientX,e.clientY]);
   if(pts.size===2){const[a,b]=[...pts.values()],dd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(last)setZ(z*dd/last);last=dd}draw()};
  cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);last=0;cv.style.cursor='grab'};
  cv.onwheel=e=>{e.preventDefault();setZ(z*(e.deltaY<0?1.08:1/1.08))};
  zs.oninput=()=>setZ(+zs.value/100);
  d.querySelector('#crpno').onclick=()=>{d.remove();res(null)};
  d.querySelector('#crpok').onclick=()=>{clamp();
   if(gif){d.remove();res(bsrc+'#c='+[cx/iw,cy/ih,z,iw,ih].map(n=>String(Math.round(n*1e5)/1e5)).join(','));return}
   const hw=W/(2*sc()),hh=H/(2*sc()),oc=document.createElement('canvas');oc.width=o.outW;oc.height=o.outH;const x=oc.getContext('2d');x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,o.outW,o.outH);x.drawImage(im,cx-hw,cy-hh,2*hw,2*hh,0,0,o.outW,o.outH);
   let q=.93,out=oc.toDataURL('image/jpeg',q);while(out.length>(o.maxLen||900000)&&q>.5){q-=.06;out=oc.toDataURL('image/jpeg',q)}
   d.remove();res(out)};
  draw()};
 im.src=bsrc})}

function vcHash(t){let h=5381;t=String(t);for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return(h>>>0).toString(36)}
function vcSeed(a,seed){a=[...a];let x=(parseInt(vcHash(seed),36)||1)>>>0;const r=()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 if(W.length>=4)W.forEach(x=>{const k=x.w.toLowerCase(),d=vcSeed(W.filter(y=>y!==x&&y.d!==x.d),k).slice(0,3).map(y=>y.d);if(d.length<3)return;

 return out}

function gmTabs(){if(!(vcOn()&&grOn()))return'';return`<div class="ptabs">${[['v','Vocab'],['g','Grammar']].map(([k,n])=>`<button class="s${GM===k?' on':''}" data-vc="mode" data-t="${k}">${n}</button>`).join('')}</div>`}
function grItems(g,n){const it=GQ.filter(x=>!g||x[0]===g).map(x=>{const o=shuf([x[2],...x[3]]);return{k:'q',h:'Which choice completes the text so that it conforms to Standard English?',p:x[1],o,a:o.indexOf(x[2]),e:x[4]}});if(!g)grOwn().forEach(q=>it.push({k:'q',p:q.q,o:q.o,a:q.a,e:q.e}));return shuf(it).slice(0,n)}
function grRun(items){if(!items.length)return grHome('Nothing to practice yet.');VC={items,i:0,res:[],live:true};vcQ()}
function grHome(msg){vcBase();const O=grOwn(),nb=S.qs.filter(grIsBank).length;
 app.innerHTML=`<div class="vcw"><h1 style="margin:.1em 0">Grammar</h1>${gmTabs()}${msg?`<p style="color:var(--ok);margin:0">${esc(msg)}</p>`:''}
 <div class="vcg">
 <div class="card vcc vc"><h2>My grammar</h2><p class="m" style="margin:0">${GQ.length} questions built on the rules the SAT tests.</p><div class="g"><label>Rule<select id="grr"><option value="">All rules</option>${GRPS.map(g=>`<option value="${g[0]}">${esc(g[1])}</option>`).join('')}</select></label><label>How many (0 = all)<input id="grn" type="number" min="0" value="10"></label></div>
 <p class="m sm" style="margin:0">${O.length?O.length+' of your own questions are included.':''}</p><div class="acts"><button class="p pill" data-vc="grstart">Practice</button><button class="pill" data-vc="gredit">${O.length?'Edit my questions':'Add my own'}</button></div></div>
 ${nb?`<div class="card vcc vc"><h2>SAT practice questions</h2><p class="m" style="margin:0">${nb} grammar questions from your practice question bank.</p><div class="g"><label>How many (0 = all)<input id="grb" type="number" min="0" value="${Math.min(20,nb)}"></label></div><div class="acts"><button class="p pill" data-vc="grbank">Solve</button></div></div>`:''}
 <div class="card vcc vc"><h2>Learn grammar rules</h2><p class="m" style="margin:0">Short rules with a wrong and a right example for each.</p><div class="acts"><button class="p pill" data-vc="grlearn">Learn</button><button class="pill" data-vc="grtips">Grammar tips</button></div></div>
 ${vsaved.length?`<div class="card vcc vc"><h2>Saved practices</h2>${vsaved.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left"><span><b>${esc(x.name)}</b><div class="m sm">${x.res.filter(r=>r!=null).length} of ${x.items.length} answered</div></span><span style="display:flex;gap:6px"><button class="p s" data-vc="vresume" data-id="${x.id}">Resume</button><button class="s" data-vc="vdel" data-id="${x.id}" aria-label="Delete">✕</button></span></div>`).join('')}</div>`:''}
 </div><div class="acts" style="margin:0"><button class="pill" data-a="home">Back</button></div></div>`}
function grLearn(t){vcBase();if(t)GT=t;const tabs=[...GRPS,['ck','Method']],L=GRL[GT]||[];
 app.innerHTML=`<div class="card c left lrn pxw"><h1>Grammar rules</h1><p class="m" style="margin:0">Learn the rule, then spot it in the questions.</p>
 <div class="ptabs">${tabs.map(([k,n])=>`<button class="s${GT===k?' on':''}" data-vc="grlt" data-t="${k}">${esc(n)}</button>`).join('')}</div>
 <div class="pxg">${L.map(r=>`<div class="pxc grc"><b>${esc(r[0])}</b><span class="mn">${esc(r[1])}</span>${r[2]?`<small><span class="bd">✗ ${esc(r[2])}</span><br><span class="gd">✓ ${esc(r[3])}</span></small>`:''}</div>`).join('')}</div>
 <div class="btns">${GT!=='ck'?`<button class="p pill" data-vc="grpr" data-t="${GT}">Practice this rule</button>`:''}<button class="pill" data-vc="home">Back to Grammar</button></div></div>`}
function grEdit(){vcBase();
 app.innerHTML=`<div class="vcz card vc"><h1 style="margin:.1em 0">My grammar questions</h1><p class="m sm" style="margin:0 0 4px">Question, options A to D, then the answer letter. Leave a blank line between questions.</p>
 <div class="vcf"><div><pre>The committee will announce ____ decision on Friday.
A) it’s
B) its
C) its’
D) their’s
Answer: B
Explanation: “Its” shows ownership.</pre><ul><li><b>Answer:</b> is required, <b>Explanation:</b> is optional</li><li>They also show up in your main practice if you turned that option on</li></ul></div></div>
 <textarea id="grta" placeholder="Paste your questions here…" spellcheck="false">${esc(ls('satgrtxt')||'')}</textarea><p class="m sm" id="grc" style="margin:6px 0"></p>
 <div class="acts"><button class="p pill" data-vc="grsave">Save</button><button class="pill" data-vc="home">Back</button></div></div>`;
 const t=$('#grta'),c=()=>{const P=vcParse(t.value);$('#grc').textContent=P.qs.length+' questions'+(P.skipped?' · '+P.skipped+' lines not understood':'')};t.oninput=c;c()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-vc]');if(!b)return;const a=b.dataset.vc,g=id=>document.getElementById(id);
 if(a==='mode'){GM=b.dataset.t;ls('satgm',GM);vcHome()}
 else if(a==='grstart')grRun(grItems(g('grr').value,nAll(g('grn').value,10)));
 else if(a==='grpr')grRun(grItems(b.dataset.t,10));
 else if(a==='grlearn')grLearn();else if(a==='grlt')grLearn(b.dataset.t);else if(a==='grtips')showTips('gr');
 else if(a==='gredit')grEdit();
 else if(a==='grbank'){const set=shuf(S.qs.filter(grIsBank)).slice(0,nAll(g('grb').value,20));if(!set.length)return;S.set=set;S.mode='practice';S.lim=0;Object.assign(S,{rec:{},full:null,fullRes:null,i:0,ans:{},chk:{},fl:{},xo:{},t0:Date.now(),done:false,paused:0,orig:false});timer();show()}
 else if(a==='grsave'){ls('satgrtxt',g('grta').value.trim()?g('grta').value:null);vcBankSync();grHome('Saved.')}
 else if(a==='grown')grRun(shuf(grOwn().map(q=>({k:'q',p:q.q,o:q.o,a:q.a,e:q.e}))))});
function grBankQs(){const out=[],L='ABCD',dm='Standard English Conventions';
 const mk=(id,sk,vp,o,ai,vx)=>({id:'gr'+id,src:'E',test:'Reading and Writing',domain:dm,skill:sk,diff:'Medium',mc:true,vc:1,gr:1,vp,vo:o,ca:L[ai],vx:vx||''});
 GQ.forEach((x,n)=>{const o=vcSeed([x[2],...x[3]],'g'+n);out.push(mk(n,x[0]==='sb'||x[0]==='pu'?'Boundaries':'Form, Structure, and Sense',x[1].replace('____','______'),o,o.indexOf(x[2]),x[4]))});
 grOwn().forEach(q=>{if(q.o.length<2||q.o.length>4)return;out.push(mk('u'+vcHash(q.q),'Form, Structure, and Sense',q.q,q.o,q.a,q.e))});return out}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='stgr')ls('satgron',t.checked?'1':'0');else if(t.id==='stgrb'||t.id==='grbk'){ls('satgrbank',t.checked?'1':'0');vcBankSync()}});
/* ---------- daily SAT practice reminders ----------
   Uses common Android notification() bridges when exposed; otherwise browser notifications.
   Checks while page is open. Reliable closed-app reminders require native scheduled notifications. */
(function initDailyPracticeReminders(){
 try{if(ls('satreminders')==null)ls('satreminders','1')}catch(_){}
 const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 function reminderConfig(){let c={days:[1,2,3,4,5]};try{c=Object.assign(c,JSON.parse(ls('satstudy')||'{}'))}catch(_){}return c}
 function practicedToday(now){let L=[];try{L=JSON.parse(ls('satlog')||'[]')}catch(_){}const key=dayKey(now);return Array.isArray(L)&&L.some(x=>x&&x.length>2&&dayKey(new Date(+x[2]))===key)}
 function checkReminder(){
  try{
   if(ls('satreminders')!=='1')return;
   const nativeReady=satNativeNotificationAvailable();
   if(!nativeReady&&(!('Notification' in window)||Notification.permission!=='granted'))return;
   const now=Date.now(),interval=Math.max(1,Math.min(24,parseInt(ls('satremindinterval')||'4',10)||4))*60*60*1000;
   let last=Number(ls('satreminderlastsent')||0);
   if(!last){ls('satreminderlastsent',String(now));return;}
   if(now-last<interval)return;
   const cfg=reminderConfig(),days=Array.isArray(cfg.days)&&cfg.days.length?cfg.days:[1,2,3,4,5];
   if(!days.includes(new Date(now).getDay()))return;
   const testDate=ls('sattest');if(testDate){const d=new Date(testDate+'T23:59:59');if(!isNaN(+d)&&new Date(now)>d)return}
   const messages=[
    ['Your SAT streak is waiting 📚','A little practice today goes a long way. Ready for a quick SAT session?'],
    ['Psst… SAT QB+ time 👀','Your study plan says today is a study day. Let’s get a few questions done.'],
    ['Future-you says thanks ✨','Even a short practice session counts. Open SAT QB+ and keep moving toward your goal.'],
    ['Quick SAT check-in 🎯','Got a few minutes? Your next practice session is ready when you are.']
   ];
   const m=messages[Math.floor(Math.random()*messages.length)];
   satSendNotification(m[0],m[1]).then(ok=>{if(ok)ls('satreminderlastsent',String(Date.now()))});
  }catch(_){/* notification support varies by browser / WebToApp */}
 }
 checkReminder();
 // Foreground polling: re-check at short intervals and whenever Android/WebView returns to the page.
 setInterval(()=>{if(!document.hidden)checkReminder()},30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){satUpdateNotificationStatus();checkReminder()}});
 window.addEventListener('focus',()=>{satUpdateNotificationStatus();checkReminder()});
 window.addEventListener('pageshow',()=>{satUpdateNotificationStatus();checkReminder()});
 window.addEventListener('online',checkReminder);
 window.SATQBCheckReminder=checkReminder;
 window.addEventListener('FlutterFcmToken',()=>{satUpdateNotificationStatus();if(satNotificationPermissionState()==='granted')checkReminder()});
 // Check permission automatically on startup; don't require a separate "check permission" button.
 setTimeout(()=>{satUpdateNotificationStatus();satAutoRequestNotificationPermission()},700);
})();

/* ---------- FCM token: read it from the app wrapper, show it to the developer, save it for server-side reminders ---------- */
(function initFcmToken(){
 let tok='',err='';
 function fromObj(o){if(!o)return '';if(typeof o==='string')return o;return String(o.token||o.fcmToken||o.registrationToken||'')}
 function detect(){
  try{const F=window.FlutterFcm;if(F){const t=fromObj(F);if(t&&t.length>20)tok=t}}catch(_){}
 }
 async function save(){
  try{
   if(!tok||!FB||!FB.user||!FB.ready||!FB.m)return;
   const mark=FB.user.uid+':'+tok;if(ls('satfcmsaved')===mark)return;
   await FB.m.Db.set(FB.m.Db.ref(FB.db,'users/'+FB.user.uid+'/fcmToken'),tok);
   ls('satfcmsaved',mark);err='';
  }catch(e){err=(e&&(e.code||e.message))||'save failed'}
 }
 function paint(){
  const el=document.getElementById('stfcm'),btn=document.getElementById('stfcmcopy');if(!el)return;
  let keys='';try{keys=window.FlutterFcm?Object.keys(window.FlutterFcm).join(', '):''}catch(_){}
  if(tok){
   const saved=FB&&FB.user&&ls('satfcmsaved')===FB.user.uid+':'+tok;
   el.textContent='FCM token found: '+tok.slice(0,12)+'…'+tok.slice(-6)+(saved?' (saved to your account)':err?' (could not save: '+err+')':FB&&FB.user?' (saving…)':' (sign in to save it)');
   if(btn)btn.style.display='';
  }else{
   el.textContent=window.FlutterFcm?'window.FlutterFcm exists but no token was found. Properties: '+(keys||'none'):'window.FlutterFcm not found. This app wrapper is not exposing an FCM token to the page.';
   if(btn)btn.style.display='none';
  }
 }
 async function tick(){detect();await save();paint()}
 window.addEventListener('FlutterFcmToken',e=>{try{const t=fromObj(e&&e.detail);if(t&&t.length>20)tok=t}catch(_){}tick()});
 document.addEventListener('click',e=>{
  const b=e.target.closest('#stfcmcopy');if(!b||!tok)return;
  try{navigator.clipboard.writeText(tok).then(()=>{b.textContent='Copied'},()=>{b.textContent='Copy failed'})}catch(_){b.textContent='Copy failed'}
 });
 setInterval(tick,3000);setTimeout(tick,1500);
})();
</script></body></html>
